# Public demo: frontend and Backend 2 in one Docker service.
# Secrets are supplied in Render, never committed here.
services:
  - type: web
    name: keme-ai-platform
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8001"
      - key: SUPABASE_URL
        value: https://qxzhrkchmzmfxvkpnbfr.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ENGINE_URL
        value: https://ai-engine-demo.onrender.com
      - key: ENGINE_JWT_SECRET
        sync: false
      - key: ENGINE_JWT_AUDIENCE
        value: ai-engine
      - key: ENGINE_JWT_ISSUER
        value: marketplace-backend
      - key: ENGINE_JWT_TTL_SECONDS
        value: "300"
      - key: ENGINE_TIMEOUT_SECONDS
        value: "180"
      - key: CORS_ORIGINS
        value: https://keme-ai.onrender.com
      - key: OAUTH_REDIRECT_ORIGINS
        value: https://keme-ai.onrender.com,https://keme-ai-platform.onrender.com,http://localhost:3000,http://127.0.0.1:8001
  - type: web
    name: keme-ai
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE
        value: https://keme-ai-platform.onrender.com/api
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /account/*
        name: Referrer-Policy
        value: no-referrer
      - path: /account/*
        name: Cache-Control
        value: no-store
