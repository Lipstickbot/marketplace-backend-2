<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Кабинет — Keme AI</title>
    <link rel="icon" href="/brand/keme-logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/account.css" />
  </head>
  <body class="directory-page account-page">
    <header class="nav is-scrolled">
      <div class="nav__inner">
        <a class="logo" href="/"
          ><img
            class="logo__mark"
            width="34"
            height="34"
            src="/brand/keme-logo.webp"
            alt=""
          /><span class="logo__word">Keme <b>AI</b></span></a
        >
        <nav class="directory-nav">
          <a href="/">Главная</a><a href="/catalog/">Каталог</a
          ><a href="/account/" class="is-current" aria-current="page">Кабинет</a>
        </nav>
      </div>
    </header>
    <main class="container workspace">
      <header class="workspace-head">
        <div>
          <h1 class="display">Рабочий кабинет</h1>
          <p id="identity" class="lead">
            Подключайте агентов и управляйте доступом к ним.
          </p>
        </div>
        <button id="logout" class="btn btn--secondary" hidden>Выйти</button>
      </header>
      <p id="notice" role="status" aria-live="polite"></p>
      <div id="workspace">Загрузка…</div>
    </main>
    <script type="module" src="/src/account.js"></script>
  </body>
</html>
